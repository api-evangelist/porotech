name: Porotech
description: >-
  Porotech (Poro Technologies Ltd) is a Cambridge University deep-tech spinout,
  founded in 2018 by Dr. Tongtong Zhu, Dr. Yingjun Liu, and Professor Rachel
  Oliver, that develops gallium nitride (GaN) semiconductor materials and
  MicroLED display technology. Its proprietary PoroGaN porous-InGaN epitaxy
  enables full-color MicroLED production on 4-to-12-inch wafers using a single
  material system, and its Dynamic Pixel Tuning (DPT) technology generates any
  visible color from a single LED chip. Porotech supplies epitaxy, micro
  displays, and light-engine products for AR/VR/MR applications, and has
  established mass-production partnerships with Foxconn, PSMC (Powerchip), and
  GIS. The company is backed by Speedinvest. Porotech is a hardware and
  semiconductor manufacturer and publishes no public API, SDK, developer portal,
  or event/streaming surface; this record is maintained for company-level
  discovery within the API Evangelist network.
